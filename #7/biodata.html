<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata</title>
</head>
<body>
    <h1>Biodata</h1>

    <form action="">
        <label for="nama">Nama Lengkap:</label>
        <input type="text" id="nama" name="nama" required><br><br>

        <label for="tempatTanggalLahir">Tempat Tanggal Lahir:</label>
        <input type="text" id="tempatTanggalLahir" name="tempatTanggalLahir" required><br><br>

        <label for="tanggalLahir">Tanggal Lahir:</label>
        <input type="date" id="tanggalLahir" name="tanggalLahir" required><br><br>

        <label for="jenisKelamin">Jenis Kelamin:</label>
        <input type="radio" id="lakiLaki" name="jenisKelamin" value="Laki-laki" required>
        <label for="lakiLaki">Laki-laki</label>
        <input type="radio" id="perempuan" name="jenisKelamin" value="Perempuan" required>
        <label for="perempuan">Perempuan</label><br><br>

        <label for="alamat">Alamat:</label>
        <input type="text" id="alamat" name="alamat" required><br><br>

        <label for="noHP">No. HP:</label>
        <input type="tel" id="noHP" name="noHP" required><br><br>

        <label for="pesan">Pesan:</label><br>
        <textarea id="pesan" name="pesan" rows="4" cols="50" required></textarea><br><br>

        <input type="submit" value="Kirim">
        <br><br>
        <input type="reset" value="Reset Form">

            <option value="Laki-laki">Laki-laki</option>
            <option value="Perempuan">Perempuan</option>
        </select><br><br> -->
</body>
</html>
